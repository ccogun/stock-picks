<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주식 분석</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-title" content="주식 분석">
<meta name="application-name" content="주식 분석">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#262a33;--text:#e8eaf0;--sub:#9aa1ad;--up:#ef4b55;--down:#3b82f6;
        --good:#22c55e;--bad:#f97316;--wait:#a1a1aa;--accent:#8b7cf6}
  @media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--card:#fff;--line:#e5e7eb;--text:#111827;--sub:#6b7280}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:16px 14px 60px}
  h1{font-size:20px;margin:4px 0 2px}
  .sub{color:var(--sub);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
  @media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
  .mk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .mk b{font-size:13px}.mk .v{font-size:17px;font-weight:700;margin-top:2px}
  .tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--sub)}
  .t-상승{color:var(--up);border-color:var(--up)}.t-하락{color:var(--down);border-color:var(--down)}.t-조정{color:var(--wait)}
  .score{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
  .score>div{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .score .n{font-size:20px;font-weight:700}
  .tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
  .tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 14px;font-size:14px}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  h2{font-size:16px;margin:18px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-weight:700;font-size:16px}.tk{color:var(--sub);font-size:12px;margin-left:4px}
  .ret{font-weight:700;font-size:17px;text-align:right;white-space:nowrap}
  .up{color:var(--up)}.down{color:var(--down)}
  .meta{color:var(--sub);font-size:12.5px;margin-top:2px}
  .v-good{color:var(--good);border-color:var(--good)}.v-bad{color:var(--bad);border-color:var(--bad)}
  ol{margin:8px 0 0;padding-left:20px}ol li{margin:2px 0;font-size:14px}
  .chart{height:260px;margin-top:10px;border-radius:10px;overflow:hidden}
  .note{font-size:12.5px;color:var(--sub);margin-top:6px}
  details summary{cursor:pointer;color:var(--accent);font-size:13.5px;margin-top:8px;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .empty{color:var(--sub);font-size:13.5px;padding:10px 2px}
  .disc{margin-top:26px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--sub);font-weight:500}td.r,th.r{text-align:right}
  .linkcell{color:var(--accent);text-decoration:underline;cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.modal{align-items:center}}
  .sheet{background:var(--bg);width:100%;max-width:860px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px 30px}
  @media(min-width:640px){.sheet{border-radius:16px}}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--bg);padding:6px 0 10px;z-index:2}
  .sheet-head b{font-size:16px}.sheet-head button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:5px 14px;font-size:14px}
  .score-line{font-size:12.5px;margin:0 0 4px 2px}
  #list table td:not(:first-child),#list table th{white-space:nowrap}
  #list table td{font-size:12.5px}
  .mkb{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
  .mkb-KOSPI{background:rgba(59,130,246,.15);color:#3b82f6}.mkb-KOSDAQ{background:rgba(139,124,246,.18);color:#8b7cf6}
  .mkb-SP500{background:rgba(34,197,94,.15);color:#16a34a}.mkb-NASDAQ{background:rgba(20,184,166,.15);color:#0d9488}
  .themerec{margin:4px 0 2px;display:flex;flex-wrap:wrap;gap:6px}.themerec span{font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--line)}.themerec span.main{font-weight:700;border-color:#ef4444;color:#ef4444}
details.cands{margin-top:18px;border-top:1px solid #ddd;padding-top:6px}details.cands>summary{cursor:pointer;font-weight:600;padding:10px 0;color:#555}
</style>
</head>
<body>
<div class="wrap">
  <h1>주식 분석</h1>
  <div class="sub" id="updated">불러오는 중…</div>
  <div class="grid" id="markets"></div>
  <div class="score" id="score"></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
  <div class="disc">이 화면은 자동 분석 결과를 기록한 것으로 투자 권유가 아닙니다. 수익률은 추천 시점 가격 대비이며,
    '지수 대비'는 같은 기간 해당 지수 수익률과의 차이입니다. 평가 기간은 20거래일, 손절선 이탈 시 조기 종료합니다.
    투자 판단과 책임은 본인에게 있습니다.</div>
</div>
<script>
const MK = {KOSPI:"코스피",KOSDAQ:"코스닥",SP500:"S&P 500",NASDAQ:"나스닥"};
const METHOD = {combined:"종합 추천",theme:"이슈 테마",theme_cand:"테마 후보",investor:"투자자 방식",chart:"차트 분석",strategy:"전통 전략",swing:"단기 스윙"};
let state = {picks:[], market:{}, tab:"KR"};
const $ = (s)=>document.querySelector(s);
const REGION = {KR:{label:"한국",mk:["KOSPI","KOSDAQ"]}, US:{label:"미국",mk:["SP500","NASDAQ"]}};
const mkb = (m)=>{const s=document.createElement("span"); s.className="mkb mkb-"+m; s.textContent=({KOSPI:"코스피",KOSDAQ:"코스닥",SP500:"S&P500",NASDAQ:"나스닥"})[m]||m; return s;};
const el = (tag, cls, text)=>{const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;};
const pct = (v)=> (v==null||isNaN(v)) ? "–" : (v>0?"+":"")+Number(v).toFixed(2)+"%";
const cls = (v)=> v>0?"up":(v<0?"down":"");
const price = (v,c)=> v==null?"–":(c==="KRW"? Math.round(v).toLocaleString("ko-KR")+"원" : "$"+Number(v).toFixed(2));
const vcls = (v)=> !v?"":(v.startsWith("잘한")?"v-good":(v.startsWith("아쉬운")?"v-bad":""));

async function load(){
  const bust = "?t="+Date.now();
  const [p,m] = await Promise.all([fetch("data/picks.json"+bust).then(r=>r.ok?r.json():{picks:[]}),
                                   fetch("data/market.json"+bust).then(r=>r.ok?r.json():{})]);
  state.picks = p.picks||[]; state.market = m;
  $("#updated").textContent = "마지막 갱신 " + (p.updated||"–").replace("T"," ") + " (한국시간)";
  drawMarkets(); drawScore(); drawTabs(); drawList();
}
function drawMarkets(){
  const box=$("#markets"); box.replaceChildren();
  for(const k of Object.keys(MK)){
    const m=state.market[k]; const d=el("div","mk");
    d.append(el("b",null,MK[k]+" "));
    if(m){ d.append(el("span","tag t-"+m.regime,m.regime));
      if(m.phase && m.phase!=="regular") d.append(el("span","tag",(m.phase==="pre"?" 프리장":m.phase==="after"?" 시간외":" 휴장")));
      d.append(el("div","v "+cls(m.chg1d), Number(m.close).toLocaleString()+"  "+pct(m.chg1d)));
      d.append(el("div","meta","고점 대비 "+pct(m.fromPeak)+" · 20일 "+pct(m.chg20d)));
    } else d.append(el("div","meta","데이터 대기"));
    box.append(d);
  }
}
function drawScore(){
  const closed = state.picks.filter(p=>p.status==="closed");
  const good = closed.filter(p=>(p.verdict||"").startsWith("잘한")).length;
  const withEx = state.picks.filter(p=>p.excess!=null && counting(p));
  const avgEx = withEx.length? withEx.reduce((a,p)=>a+p.excess,0)/withEx.length : null;
  const items = [["전체 추천", state.picks.length+"개"],
    ["진행 중", state.picks.filter(p=>p.status==="active").length+"개"],
    ["적중률(종료분)", closed.length? Math.round(good/closed.length*100)+"% ("+good+"/"+closed.length+")" : "–"],
    ["평균 지수 대비", pct(avgEx)]];
  const box=$("#score"); box.replaceChildren();
  for(const [k,v] of items){const d=el("div"); d.append(el("div","sub",k)); d.append(el("div","n",v)); box.append(d);}
}
function drawTabs(){
  const box=$("#tabs"); box.replaceChildren();
  for(const k of ["KR","US","THEME","MAP","PAT","ALL","LEARN"]){
    const b=el("button", state.tab===k?"on":"", k==="THEME"?"테마":k==="ALL"?"전체 기록":k==="LEARN"?"학습":k==="PAT"?"가격대 패턴":k==="MAP"?"섹터 지도":REGION[k].label);
    b.addEventListener("click",()=>{state.tab=k; drawTabs(); drawList();}); box.append(b);
  }
}
function drawList(){
  const box=$("#list"); box.replaceChildren();
  if(state.tab==="ALL") return drawHistory(box);
  if(state.tab==="LEARN") return drawLearn(box);
  if(state.tab==="PAT") return drawPatterns(box);
  if(state.tab==="MAP") return drawHeatmap(box);
  if(state.tab==="THEME") return drawThemes(box);
  const mks=(REGION[state.tab]||REGION.KR).mk;
  for(const k of mks){ const m=state.market[k]; if(!m) continue;
    const n=el("div","note"); n.append(mkb(k)); n.firstChild.style.marginLeft="0";
    n.append(document.createTextNode(" "+m.regime+" — "+m.note + (m.lastScan? " · 마지막 스캔 "+m.lastScan.replace("T"," "):""))); box.append(n); }
  const act=meth=>state.picks.filter(p=>mks.includes(p.market) && p.method===meth && p.status==="active")
                             .sort((a,b)=>b.recAt.localeCompare(a.recAt));
  box.append(el("h2",null,"종합 추천"));
  box.append(el("div","note","투자자 근거(외국인·기관 동반 순매수, 내부자 매수, 13D, 액티브 ETF 편입)와 차트 근거(돌파·눌림·지지 반등 등)가 함께 있는 종목만 고릅니다. 적자·부채비율 300% 초과 종목은 제외, 시장별 하루 최대 3종목이며 없는 날도 있습니다."));
  const main=[...act("combined"), ...act("investor")];
  if(!main.length) box.append(el("div","empty","지금은 두 근거가 모두 맞는 종목이 없습니다."));
  main.forEach(p=>box.append(card(p)));
  const det=el("details","cands"); const sm=el("summary",null,"방식별 후보 보기 (학습용 · "+["chart","strategy","swing"].reduce((n,m)=>n+act(m).length,0)+"종목)");
  det.append(sm);
  det.append(el("div","note","아래는 한 가지 근거만 맞은 후보입니다. 매수 추천이 아니라, 어떤 신호가 실제로 통하는지 성적을 쌓는 용도입니다."));
  for(const meth of ["chart","strategy","swing"]){
    det.append(el("h2",null,METHOD[meth]+(meth==="swing"?" (1~5일 · 모의 검증)":"")));
    const items=act(meth);
    if(!items.length) det.append(el("div","empty","지금은 조건을 통과한 종목이 없습니다."));
    items.forEach(p=>det.append(card(p)));
  }
  box.append(det);
  const closed = state.picks.filter(p=>mks.includes(p.market) && p.status==="closed").sort((a,b)=>(b.closedAt||"").localeCompare(a.closedAt||""));
  if(closed.length){ box.append(el("h2",null,"종료된 추천")); closed.slice(0,20).forEach(p=>box.append(card(p))); }
}
const counting=p=>(p.daysHeld||0)>=1;   // 추천일 다음 거래일 종가부터 집계
function card(p){
  const c=el("div","card");
  const top=el("div","row"); const left=el("div");
  const nm=el("span","name",p.name); left.append(nm, mkb(p.market), el("span","tk",p.ticker));
  left.append(el("div","meta", METHOD[p.method]+" · "+p.recAt.replace("T"," ").slice(0,16)+" 추천 · "+price(p.recPrice,p.currency)));
  const right=el("div");
  if(p.entry==="pending"){ right.append(el("div","ret","진입 대기")); right.append(el("div","meta","다음 정규장 시가 기준")); }
  else if(counting(p)){ right.append(el("div","ret "+cls(p.ret), pct(p.ret)));
    right.append(el("div","meta", "지수 대비 "+pct(p.excess))); }
  else { right.append(el("div","ret","집계 전")); right.append(el("div","meta","다음 거래일 종가부터")); }
  top.append(left,right); c.append(top);
  const line=el("div","meta");
  line.append(el("span","tag "+vcls(p.verdict), p.verdict||"판단 중"));
  line.append(document.createTextNode("  "+(p.status==="closed"?"종료가 ":"현재 ")+price(p.lastPrice,p.currency)+(counting(p)?" · 최고 "+pct(p.maxRet)+" · 최저 "+pct(p.minRet):" · 오늘 추천")
    + (p.closeReason? " · "+p.closeReason : "")));
  c.append(line);
  if(p.ext && counting(p)) c.append(el("div","meta "+cls(p.ext.ret), (p.ext.phase==="pre"?"프리마켓 ":"애프터마켓 ")+price(p.ext.price,p.currency)+" (추천가 대비 "+pct(p.ext.ret)+", 참고용)"));
  if(p.entryNote) c.append(el("div","meta",p.entryNote));
  if(p.source) c.append(el("div","meta","근거: "+p.source));
  const ol=el("ol"); (p.reasons||[]).slice(0,5).forEach(r=>ol.append(el("li",null,r))); c.append(ol);
  const det=el("details"); det.append(el("summary",null,"차트 보기"));
  det.addEventListener("toggle",()=>{ if(det.open && !det.dataset.done){det.dataset.done=1; drawChart(det,p);} });
  c.append(det);
  return c;
}
async function drawChart(host,p){
  const box=el("div","chart"); host.append(box);
  if(p.chartNote) host.append(el("div","note",p.chartNote));
  let j; try{ j=await fetch("data/prices/"+p.ticker.replace("^","IDX_")+".json?t="+Date.now()).then(r=>r.json()); }
  catch(e){ box.replaceWith(el("div","empty","차트 데이터가 아직 없습니다. 다음 갱신 때 채워집니다.")); return; }
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const ch = LightweightCharts.createChart(box,{width:box.clientWidth,height:260,
    layout:{background:{color:"transparent"},textColor:dark?"#9aa1ad":"#6b7280"},
    grid:{vertLines:{visible:false},horzLines:{color:dark?"#262a33":"#eef0f3"}},
    rightPriceScale:{borderVisible:false},timeScale:{borderVisible:false},handleScroll:false,handleScale:false});
  const d=j.d.map(r=>({time:r[0],open:r[1],high:r[2],low:r[3],close:r[4],v:r[5]}));
  const cs=ch.addCandlestickSeries({upColor:"#ef4b55",downColor:"#3b82f6",borderVisible:false,wickUpColor:"#ef4b55",wickDownColor:"#3b82f6"});
  cs.setData(d);
  const ma=(n)=>d.map((x,i)=>i<n-1?null:{time:x.time,value:d.slice(i-n+1,i+1).reduce((a,y)=>a+y.close,0)/n}).filter(Boolean);
  ch.addLineSeries({color:"#f59e0b",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false}).setData(ma(20));
  ch.addLineSeries({color:"#60a5fa",lineWidth:1.5,priceLineVisible:false,lastValueVisible:false}).setData(ma(50));
  const vs=ch.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"v",color:dark?"#3a3f4b":"#d1d5db"});
  ch.priceScale("v").applyOptions({scaleMargins:{top:0.82,bottom:0}});
  vs.setData(d.map(x=>({time:x.time,value:x.v})));
  if(p.stop) cs.createPriceLine({price:+p.stop,color:"#ef4444",lineStyle:2,lineWidth:1,title:"손절"});
  if(p.target) cs.createPriceLine({price:+p.target,color:"#22c55e",lineStyle:2,lineWidth:1,title:"목표"});
  const rec=d.find(x=>x.time>=p.recDate);
  if(rec) cs.setMarkers([{time:rec.time,position:"belowBar",color:"#8b7cf6",shape:"arrowUp",text:"추천"}]);
  ch.timeScale().fitContent();
  new ResizeObserver(()=>ch.applyOptions({width:box.clientWidth})).observe(box);
}
function outcomeOf(p){
  const s=p.snap||{}; const k=p.method==="swing"?"5":"10";
  if(s[k]!=null) return s[k];
  if(p.status==="closed") return p.outcome!=null?p.outcome:(p.excess!=null?p.excess:null);
  return null;
}
// ── 팝업 창 관리: 폰의 뒤로가기 = 닫기 ──
const MODALS=[];
function mountModal(bg){
  const entry={bg};
  const esc=e=>{ if(e.key==="Escape" && MODALS[MODALS.length-1]===entry) requestClose(); };
  entry.remove=()=>{ bg.remove(); document.removeEventListener("keydown",esc); if(!MODALS.length) document.body.style.overflow=""; };
  MODALS.push(entry);
  try{ history.pushState({spModal:MODALS.length},""); entry.hist=true; }catch(e){}
  function requestClose(){
    if(MODALS[MODALS.length-1]!==entry) return;
    if(entry.hist) history.back();          // popstate에서 실제로 닫힘
    else { MODALS.pop(); entry.remove(); }
  }
  document.addEventListener("keydown",esc);
  bg.addEventListener("click",e=>{ if(e.target===bg) requestClose(); });
  document.body.style.overflow="hidden"; document.body.append(bg);
  return requestClose;
}
window.addEventListener("popstate",()=>{ const m=MODALS.pop(); if(m) m.remove(); });

function openGroup(title,list,mode){
  const ev=list.filter(p=>outcomeOf(p)!=null).sort((a,b)=>outcomeOf(b)-outcomeOf(a));
  const op=list.filter(p=>outcomeOf(p)==null).sort((a,b)=>b.recAt.localeCompare(a.recAt));
  const bg=el("div","modal"); const sh=el("div","sheet"); bg.append(sh);
  const hd=el("div","sheet-head"); const x=el("button",null,"닫기");
  hd.append(el("b",null,title+" · "+list.length+"건"),x); sh.append(hd);
  let close=()=>{};
  x.addEventListener("click",()=>close());
  const sec=(name,arr,showScore)=>{
    if(!arr.length) return;
    sh.append(el("h2",null,name+" ("+arr.length+"건)"));
    arr.forEach(p=>{ if(showScore){const o=outcomeOf(p);
        sh.append(el("div","score-line "+cls(o),"평가 지표(지수 대비 "+(p.method==="swing"?"5":"10")+"거래일 또는 종료 시점): "+pct(o).replace("%","%p")));}
      const cd=card(p); cd.style.cursor="pointer";
      const more=el("div","meta","눌러서 추천가·대응 방향 보기 ›"); more.style.color="var(--accent)"; more.style.marginTop="6px"; cd.append(more);
      cd.addEventListener("click",e=>{ if(e.target.closest("details")) return; openDetail(p); });
      sh.append(cd); });
  };
  if(mode!=="open") sec("평가 완료 — 성과순",ev,true);
  if(mode!=="eval") sec("진행 중",op,false);
  if(!sh.querySelector(".card")) sh.append(el("div","empty","해당 종목이 없습니다."));

function squarify(items,x,y,w,h){
  const out=[]; const total=items.reduce((a,b)=>a+b.v,0); if(!total||w<=0||h<=0) return out;
  const sc=w*h/total; let rest=items.map(it=>({...it,a:it.v*sc}));
  const worst=(row,len)=>{const s=row.reduce((a,b)=>a+b.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));
    return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){
    const len=Math.min(w,h); let row=[rest[0]]; let i=1;
    while(i<rest.length && worst(row.concat(rest[i]),len)<=worst(row,len)){row.push(rest[i]); i++;}
    const s=row.reduce((a,b)=>a+b.a,0);
    if(w>=h){ const cw=s/h; let cy=y; row.forEach(r=>{const rh=r.a/cw; out.push({...r,x,y:cy,w:cw,h:rh}); cy+=rh;}); x+=cw; w-=cw; }
    else { const rh=s/w; let cx=x; row.forEach(r=>{const cw2=r.a/rh; out.push({...r,x:cx,y,w:cw2,h:rh}); cx+=cw2;}); y+=rh; h-=rh; }
    rest=rest.slice(i);
  }
  return out;
}

  if(!j.items.length){ box.append(el("div","empty","현재가 근처의 지지 가격대가 없습니다.")); return; }
  const t=el("table"); const h=el("tr");
  ["종목","가격대","현재가(거리)","상태","과거(확인 후)"].forEach((x,i)=>h.append(el("th",i>=2&&i!==3?"r":"",x))); t.append(h);
  j.items.forEach(p=>{const r=el("tr"); const cur=p.currency;
    const nm=el("td",null,p.name); nm.append(mkb(p.market==="US"?"SP500":"KOSPI")); nm.lastChild.textContent=p.market==="US"?"미국":"한국";
    const st=el("td",null,p.status||(p.near?"근처":"–"));
    if(p.status&&p.status.startsWith("반등")) st.style.color="var(--good)"; else if(p.status&&p.status.startsWith("도달")) st.style.color="#eab308"; else if(p.status) st.style.color="var(--bad)";
    const past=p.confEvents? p.confEvents+"회 "+p.confWinRate+"%" : (p.events? "닿음 "+p.events+"회 "+p.winRate+"%" : "사례 없음");
    r.append(nm, el("td",null,price(p.low,cur)+"~"+price(p.high,cur)), el("td","r",price(p.lastClose,cur)+" ("+pct(p.distPct)+")"), st, el("td","r",past));
    r.style.cursor="pointer"; r.addEventListener("click",()=>{ const nx=r.nextSibling; if(nx&&nx.dataset.d){nx.remove();return;}
      const d=el("tr"); d.dataset.d=1; const td=el("td"); td.colSpan=5; td.className="meta"; td.style.whiteSpace="normal";
      td.textContent=(p.history.length? "과거 사례: "+p.history.map(e=>e.date.slice(2)+" "+price(e.entry,cur)+(e.ret20!=null?" → 20일 "+pct(e.ret20):" (진행 중)")+(e.confirmed?" · 반등확인"+(e.cret20!=null?" "+pct(e.cret20):""):"")).join(" / ") : "그 가격대가 생긴 뒤 아직 닿은 적이 없습니다.")
        +" · 이 종목 평소 20일 평균 "+pct(p.baseline20)+(p.breakRate!=null?" · 이탈률 "+p.breakRate+"%":"");
      d.append(td); r.after(d); });
    t.append(r);});
  const wrap=el("div"); wrap.style.overflowX="auto"; wrap.append(t); box.append(wrap);
  box.append(el("div","note","상태: '도달'은 오늘 가격대에 닿음(내일 반등 확인 필요), '반등 확인'은 어제 닿고 오늘 반등(매수 후보). 행을 누르면 과거 사례가 보입니다. 종목별 과거 사례는 표본이 적어 참고만 하세요."));
  (j.watch||[]).forEach(w=>{ box.append(el("h2",null,"관찰 종목: "+w.name+" ("+w.ticker+")"));
    box.append(el("div","note",w.note));
    w.zones.forEach(z=>{ const c=el("div","card");
      c.append(el("div",null,price(z.low,"USD")+"~"+price(z.high,"USD")+" · 현재 "+price(z.lastClose,"USD")+" ("+pct(z.distPct)+")"+(z.status?" · "+z.status:"")));
      c.append(el("div","meta","닿은 횟수 "+z.events+"회"+(z.events?" · 20일 승률 "+z.winRate+"% · 평균 "+pct(z.avgRet20):"")+" · 반등 확인 "+z.confEvents+"회"+(z.confEvents?" (승률 "+z.confWinRate+"%)":"")+" · 평소 "+pct(z.baseline20)));
      if(z.history.length) c.append(el("div","meta",z.history.map(e=>e.date+" "+price(e.entry,"USD")+(e.ret20!=null?" → 20일 "+pct(e.ret20):"")).join(" / ")));
      box.append(c); }); });
}
// ── 내가 산 종목 (이 기기 브라우저에만 저장) ──
const HKEY="sp_holdings_v1";
function getHold(){ try{ return JSON.parse(localStorage.getItem(HKEY)||"{}"); }catch(e){ return {}; } }
function setHold(id,v){ const all=getHold(); if(v) all[id]=v; else delete all[id];
  try{ localStorage.setItem(HKEY,JSON.stringify(all)); return true; }catch(e){ return false; } }
let histMine=false;

function makeSheet(title){
  const bg=el("div","modal"); const sh=el("div","sheet"); bg.append(sh);
  const hd=el("div","sheet-head"); const x=el("button",null,"닫기");
  hd.append(el("b",null,title),x); sh.append(hd);
  const close=mountModal(bg);
  x.addEventListener("click",()=>close());
  return {sh,close};
}
function kv(box,k,v,c){ const r=el("div","row"); r.style.padding="5px 0"; r.style.borderBottom="1px solid var(--line)";
  r.append(el("span","sub",k), el("b",c||"",v)); box.append(r); }

// 대응 방향: 추천 손절·목표가와 지금 가격으로 판단 (참고용 규칙)
function advice(p, base){
  const cur=p.lastPrice, cu=p.currency, rp=+p.recPrice;
  if(p.entry==="pending") return ["다음 정규장 시가에 진입가가 확정됩니다. 그 전에는 추격 매수하지 마세요."];
  if(!cur||!rp) return ["시세 대기 중입니다."];
  const b=base||rp, r=b/rp;                     // 내 매수가 기준이면 같은 비율로 환산
  const stop=p.stop?p.stop*r:null, tgt=p.target?p.target*r:null;
  const tgt2=tgt?b+(tgt-b)*1.8:null, gain=(cur/b-1)*100;
  const out=[];
  if(p.status==="closed"){
    out.push("추천이 종료됐습니다("+(p.closeReason||"평가 종료")+"). 보유 중이면 계속 들고 갈 새 이유가 없는 한 정리를 검토하세요.");
    return out;
  }
  if(stop && cur<=stop) out.push("손절선 "+price(stop,cu)+" 아래입니다. 원칙대로라면 정리할 구간입니다.");
  else if(tgt && cur>=tgt){
    out.push("1차 목표 "+price(tgt,cu)+" 도달 — 절반 익절을 고려하세요.");
    out.push("나머지는 손절선을 매수가("+price(b,cu)+")로 올려 본전을 지키고, 2차 목표 "+price(tgt2,cu)+"까지 보유를 검토하세요.");
  } else if(gain>0){
    out.push("보유 — 1차 익절 목표 "+price(tgt,cu)+" ("+pct((tgt/b-1)*100)+"), 손절선 "+price(stop,cu)+".");
    if(tgt && cur>=b+(tgt-b)/2) out.push("목표까지 절반 이상 왔습니다. 손절선을 매수가 "+price(b,cu)+"로 올려 수익을 지키세요.");
  } else {
    out.push("매수가 아래지만 손절선 위입니다. 추가 매수(물타기)보다 손절선 "+price(stop,cu)+" 이탈 여부를 지켜보세요.");
    if(tgt) out.push("반등 시 1차 목표는 "+price(tgt,cu)+"입니다.");
  }
  if(p.method==="swing") out.push("단기 스윙(모의 검증)이라 5거래일이 지나면 결과와 관계없이 정리하는 것이 원칙입니다.");
  return out;
}

function openDetail(p){
  const {sh}=makeSheet(p.name);
  { const d=el("div","meta"); d.append(mkb(p.market)); d.firstChild.style.marginLeft="0";
    d.append(document.createTextNode(" "+p.ticker+" · "+(METHOD[p.method]||p.method))); sh.append(d); }
  const info=el("div","card");
  kv(info,"추천 일시",p.recAt.replace("T"," ").slice(0,16)+(p.recDate!==p.recAt.slice(0,10)?" (기준일 "+p.recDate+")":""));
  kv(info,"추천 가격",p.entry==="pending"?"진입 대기":price(p.recPrice,p.currency));
  kv(info,p.status==="closed"?"종료 가격":"현재 가격",price(p.lastPrice,p.currency)+(p.lastDate?" ("+p.lastDate.slice(5)+")":""));
  kv(info,"수익률",counting(p)?pct(p.ret):"집계 전",counting(p)?cls(p.ret):"");
  kv(info,"지수 대비",counting(p)?pct(p.excess).replace("%","%p"):"–",counting(p)?cls(p.excess):"");
  if(counting(p)) kv(info,"추천 후 최고 / 최저",pct(p.maxRet)+" / "+pct(p.minRet));
  kv(info,"손절가 / 1차 목표가",(p.stop?price(p.stop,p.currency):"–")+" / "+(p.target?price(p.target,p.currency):"–"));
  kv(info,"평가",(p.verdict||"판단 중")+(p.status==="closed"?" (종료)":""),vcls(p.verdict));
  if(p.entryNote) info.append(el("div","note",p.entryNote));
  sh.append(info);

  // 내 매수 기록
  const mine=el("div","card"); sh.append(el("h2",null,"내 매수"));
  const hold=getHold()[p.id];
  const lab=el("label"); lab.style.display="flex"; lab.style.alignItems="center"; lab.style.gap="8px";
  const cb=el("input"); cb.type="checkbox"; cb.checked=!!hold; cb.style.width="20px"; cb.style.height="20px";
  lab.append(cb, el("span",null,"이 종목을 샀어요"));
  const row=el("div"); row.style.marginTop="8px"; row.style.display=hold?"flex":"none"; row.style.gap="8px"; row.style.alignItems="center";
  const inp=el("input"); inp.type="text"; inp.inputMode="decimal"; inp.placeholder="매수가"; inp.autocomplete="off";
  // 천 단위 쉼표: 숫자·소수점만 남기고 정수부에 쉼표
  const fmtNum=v=>{ v=String(v).replace(/[^0-9.]/g,""); const i=v.indexOf("."); if(i>=0) v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"");
    const [a,b]=v.split("."); const ai=a.replace(/^0+(?=\d)/,"").replace(/\B(?=(\d{3})+(?!\d))/g,","); return b!==undefined?ai+"."+b:ai; };
  inp.value=hold&&hold.price?fmtNum(hold.price):"";
  inp.addEventListener("input",()=>{ const pos=inp.selectionStart, before=inp.value.slice(0,pos).replace(/[^0-9.]/g,"").length;
    inp.value=fmtNum(inp.value); let k=0,np=0; while(np<inp.value.length&&k<before){ if(/[0-9.]/.test(inp.value[np])) k++; np++; }
    try{ inp.setSelectionRange(np,np); }catch(e){} }); Object.assign(inp.style,{flex:"1",padding:"8px",borderRadius:"8px",border:"1px solid var(--line)",background:"var(--bg)",color:"var(--text)",fontSize:"16px"});
  const save=el("button",null,"저장"); Object.assign(save.style,{border:"1px solid var(--accent)",background:"var(--accent)",color:"#fff",borderRadius:"8px",padding:"8px 14px",fontSize:"15px"});
  row.append(el("span","sub",p.currency==="KRW"?"원":"$"),inp,save);
  const msg=el("div","meta");
  mine.append(lab,row,msg); sh.append(mine);
  const adv=el("div","card"); sh.append(el("h2",null,"대응 방향")); sh.append(adv);
  const drawAdv=()=>{ adv.replaceChildren(); const hd=getHold()[p.id]; const base=hd&&hd.price?+hd.price:null;
    if(base&&p.lastPrice){ adv.append(el("div","meta "+cls(p.lastPrice/base-1),"내 매수가 "+price(base,p.currency)+" 기준 수익률 "+pct((p.lastPrice/base-1)*100))); }
    advice(p,base).forEach(t=>adv.append(el("div",null,"• "+t)));
    adv.append(el("div","note",base?"내 매수가 기준으로 손절·목표가를 같은 비율로 환산했습니다.":"추천 가격 기준입니다. 매수가를 입력하면 내 가격 기준으로 바뀝니다."));
    adv.append(el("div","note","규칙에 따른 참고용 안내이며 투자 권유가 아닙니다.")); };
  const persist=()=>{ const v=parseFloat(inp.value.replace(/,/g,"")); const ok=setHold(p.id, cb.checked?{price:isNaN(v)?null:v, at:new Date().toISOString().slice(0,10)}:null);
    msg.textContent=ok?(cb.checked?"저장했어요 (이 기기에만 저장됩니다)":"매수 표시를 지웠어요"):"저장하지 못했어요 (브라우저 저장소를 쓸 수 없음)";
    drawAdv(); if(state.tab==="ALL") drawList(); };
  cb.addEventListener("change",()=>{ row.style.display=cb.checked?"flex":"none"; persist(); if(cb.checked) inp.focus(); });
  save.addEventListener("click",persist);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") persist(); });
  drawAdv();
  sh.append(el("h2",null,"추천 사유·차트")); sh.append(card(p));
}

function drawHistory(box){
  box.append(el("h2",null,"전체 추천 기록"));
  const hold=getHold();
  const tg=el("label","meta"); tg.style.display="flex"; tg.style.gap="6px"; tg.style.alignItems="center"; tg.style.margin="0 0 8px";
  const c=el("input"); c.type="checkbox"; c.checked=histMine; c.addEventListener("change",()=>{histMine=c.checked; drawList();});
  tg.append(c, document.createTextNode("내가 산 종목만 보기 ("+Object.keys(hold).filter(id=>state.picks.some(p=>p.id===id)).length+"개)"));
  box.append(tg);
  box.append(el("div","note","행을 누르면 추천가·현재가·대응 방향을 보고, 산 종목은 매수가를 기록할 수 있어요."));
  const t=el("table"); const h=el("tr");
  ["종목","방식","추천일","수익률","지수 대비","평가"].forEach((x,i)=>h.append(el("th",i>=3&&i<=4?"r":"",x)));
  t.append(h);
  [...state.picks].filter(p=>!histMine||hold[p.id]).sort((a,b)=>b.recAt.localeCompare(a.recAt)).forEach(p=>{
    const r=el("tr"); r.style.cursor="pointer";
    const nm=el("td",null,(hold[p.id]?"✓ ":"")+p.name); if(hold[p.id]) nm.style.fontWeight="700"; nm.append(mkb(p.market));
    r.append(nm, el("td",null,({combined:"종합",theme:"테마",theme_cand:"테마후보",chart:"차트",investor:"투자자",strategy:"전략",swing:"스윙"}[p.method]||p.method)),
      el("td",null,p.recDate.slice(5)), el("td","r "+(counting(p)?cls(p.ret):""),counting(p)?pct(p.ret):(p.entry==="pending"?"진입 대기":"집계 전")), el("td","r "+(counting(p)?cls(p.excess):""),counting(p)?pct(p.excess):"–"),
      (()=>{const v=p.verdict||"판단 중"; const td=el("td",null,(v.startsWith("잘한")?"잘함":v.startsWith("아쉬운")?"아쉬움":v)+(p.status==="closed"?"·종료":""));
        td.style.color=v.startsWith("잘한")?"var(--good)":v.startsWith("아쉬운")?"var(--bad)":""; return td;})());
    r.addEventListener("click",()=>openDetail(p));
    t.append(r);
  });
  if(histMine && !t.querySelector("tr+tr")) box.append(el("div","empty","아직 산 종목으로 표시한 게 없어요."));
  box.append(t);
}
