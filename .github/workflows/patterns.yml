name: price-patterns

on:
  schedule:
    - cron: "50 21 * * 1-5"   # 미국 장 마감 후(한국 06:50) 하루 한 번
  workflow_dispatch:
  push:
    paths: ["scripts/patterns.py"]

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/patterns.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/patterns.json
          git diff --cached --quiet && exit 0
          git commit -m "data: 가격대 패턴 $(TZ=Asia/Seoul date '+%Y-%m-%d') 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
