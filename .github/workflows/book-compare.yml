name: book-compare

on:
  workflow_dispatch:
  push:
    paths: ["scripts/book_compare.py", "scripts/booksig.py"]
  schedule:
    - cron: "50 22 * * 6"   # 매주 일요일 07:50 KST 재검증

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/book_compare.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/book_compare.json
          git diff --cached --quiet && exit 0
          git commit -m "data: 차트의 기술 기법 검증 $(TZ=Asia/Seoul date '+%Y-%m-%d') 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
