name: apk-schemes
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/apk-schemes.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q androguard==3.4.0a1 || pip install -q androguard
      - run: curl -sSL -A "Mozilla/5.0" -o hero.apk http://download.kiwoom.com/mts/HeroS1.apk && ls -la hero.apk && file hero.apk
      - name: 영웅문S# 앱 링크(intent-filter) 추출
        run: |
          python - <<'PY'
          import zipfile, re
          try:
              from androguard.core.apk import APK
          except ImportError:
              from androguard.core.bytecodes.apk import APK
          a = APK("hero.apk")
          print("PACKAGE", a.get_package(), "MAIN", a.get_main_activity())
          m = a.get_android_manifest_xml()
          ns = "{http://schemas.android.com/apk/res/android}"
          for act in m.iter():
              if act.tag not in ("activity", "activity-alias"): continue
              for f in act.findall("intent-filter"):
                  cats = [c.get(ns+"name") for c in f.findall("category")]
                  datas = [{k.replace(ns,""):v for k,v in d.attrib.items()} for d in f.findall("data")]
                  if datas or "android.intent.category.BROWSABLE" in cats:
                      print("ACT", act.get(ns+"name"), "exported=", act.get(ns+"exported"), "CATS", cats, "DATA", datas)
          PY
