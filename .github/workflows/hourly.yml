name: hourly-scan

on:
  schedule:
    # 매시간 실행, 거래 가능 시간인 시장만 스캔(run.py가 판단)
    # 한국 08:00~20:00 KST(넥스트레이드 포함), 미국 04:00~20:00 ET(프리·애프터 포함)
    - cron: "25 * * * 1-5"
    - cron: "25 0 * * 6"        # 미국 금요일 애프터마켓
    - cron: "25 23 * * 0"       # 한국 월요일 프리마켓
  workflow_dispatch:
    inputs:
      markets:
        description: "auto / all / KOSPI,KOSDAQ,SP500,NASDAQ"
        default: "auto"
  push:
    paths: ["docs/data/inbox/**", "scripts/**"]   # Claude가 추천을 넣으면 바로 가격·차트 채움

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan & track
        run: |
          MK="${{ github.event.inputs.markets }}"
          python scripts/run.py --markets "${MK:-auto}"
          python scripts/review.py
          python scripts/heatmap.py || echo "heatmap 실패(다음 실행에 재시도)"
          python scripts/alerts.py || echo "가격 알림 확인 실패(다음 실행에 재시도)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
